name: build

# Build host is GitHub Actions: nobody builds locally (no virtualization on the dev machine).
on:
  push:
    branches: ['**']
    tags: ['v*']
    # tag pushes ignore path filters, so releases always build
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# a newer push to the same branch cancels the older, now-stale run
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_DEPS: build-essential libdw-dev zstd ccache bc bison flex libssl-dev libelf-dev dwarves rsync cpio kmod dpkg-dev debhelper fakeroot gnupg ca-certificates curl jq xz-utils python3 make
  ISO_DEPS: live-build make ca-certificates xorriso apt-utils

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.c.outputs.unit }}
      build: ${{ steps.c.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        # shortcut: skips jobs until the agents' files land on the branch; delete this job once main has them
        run: |
          echo "unit=$([ -f tests/run.sh ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "build=$([ -f Makefile ] && [ -f kernel/build.sh ] && [ -f live/auto/config ] && [ -f tests/smoke.sh ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  unit:
    needs: check
    if: needs.check.outputs.unit == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (with non-free-firmware for package checks)
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends $KERNEL_DEPS $ISO_DEPS
      - run: bash tests/run.sh
      - name: lb config renders
        run: |
          [ -f live/auto/config ] || exit 0
          cd live && lb config && grep -q 'preempt=full' config/binary

  kernel:
    needs: [check, unit]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: kver
        run: |
          curl -fsSL https://www.kernel.org/releases.json -o /tmp/releases.json
          echo "kver=$(bash -c 'source kernel/fetch.sh; pick_longterm /tmp/releases.json')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: live/config/packages.chroot
          key: kernel-${{ steps.kver.outputs.kver }}-${{ hashFiles('kernel/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # ccache survives failed runs (save runs on always()), so a late failure no longer costs a full rebuild.
      # Caches from feature branches are not visible to main; main seeds its own.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-
      - if: steps.cache.outputs.cache-hit != 'true'
        run: >
          docker run --rm -v "$PWD:/w" -w /w
          -e CCACHE_DIR=/w/.ccache -e CCACHE_MAXSIZE=6G -e KCC="ccache gcc"
          debian:trixie bash -c "apt-get update && apt-get install -y --no-install-recommends $KERNEL_DEPS && ccache -z && make kernel; rc=\$?; ccache -s; exit \$rc"
      - if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-deb
          path: live/config/packages.chroot/*.deb
          if-no-files-found: error

  iso:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel-deb
          path: live/config/packages.chroot
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - run: docker run --rm --privileged -v "$PWD:/w" -w /w debian:trixie bash -c "apt-get update && apt-get install -y --no-install-recommends $ISO_DEPS && make iso"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: out/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/vdtos-amd64.hybrid.iso
          retention-days: 7
          if-no-files-found: error

  smoke:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - run: bash tests/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log
          path: out/serial.log

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: kernel-deb
          path: out/kernel
      # GPL: ship the exact kernel source (unpatched kernel.org tarball + signature) and the .config it was built with
      - name: Collect kernel source and config
        run: |
          deb=$(ls out/kernel/linux-image-*-vdtos_*.deb | grep -v -- '-dbg_' | head -n1)
          kver=$(dpkg-deb -f "$deb" Version); kver=${kver%-*}
          base="https://cdn.kernel.org/pub/linux/kernel/v${kver%%.*}.x"
          curl -fsSL "$base/linux-$kver.tar.xz" -o "out/linux-$kver.tar.xz"
          curl -fsSL "$base/linux-$kver.tar.sign" -o "out/linux-$kver.tar.sign"
          gpg --locate-keys torvalds@kernel.org gregkh@kernel.org
          bash -c 'source kernel/fetch.sh; verify_tarball "$1" "$2"' _ "out/linux-$kver.tar.xz" "out/linux-$kver.tar.sign"
          dpkg-deb --fsys-tarfile "$deb" | tar -xO --wildcards './boot/config-*' > "out/config-$kver-vdtos"
          cp "$deb" out/
      - run: >
          gh release create "$GITHUB_REF_NAME" out/vdtos-amd64.hybrid.iso out/linux-*.tar.xz out/linux-*.tar.sign
          out/config-*-vdtos out/linux-image-*.deb --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
